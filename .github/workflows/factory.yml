# Copy to .github/workflows/factory.yml in a target repo.
#
# Setup for the target repo (you run these):
#   gh label create factory -R DustyStudy/factory-test-target --color 1D76DB
#   gh secret set ANTHROPIC_API_KEY -R DustyStudy/factory-test-target
# Settings > Actions > General: allow "Allow GitHub Actions to create and approve pull requests".
#
# The target must provide a gate script at gate_path. It must exit 0 when the change is good.

name: Issue factory

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  factory:
    if: github.event.label.name == 'factory' && github.event.sender.login == github.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Pinned to the issue-factory commit that has the checkout-ref fix (PR #3).
    uses: DustyStudy/issue-factory/.github/workflows/factory.yml@1a808b4efbae9f181ba2dbef393573e7cc03b202
    with:
      gate_path: scripts/factory/gate.sh
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      # factory_pat: ${{ secrets.FACTORY_PAT }}   # optional: lets factory PRs trigger CI

# Copy to .github/workflows/factory.yml in a target repo.
#
# Setup for the target repo (you run these):
#   gh label create factory -R DustyStudy/factory-test-target --color 1D76DB
#   gh secret set ANTHROPIC_API_KEY -R DustyStudy/factory-test-target
# Settings > Actions > General: allow "Allow GitHub Actions to create and approve pull requests".
#
# The target must provide a gate script at gate_path. It must exit 0 when the change is good.

name: Issue factory

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  factory:
    if: github.event.label.name == 'factory' && github.event.sender.login == github.repository_owner
    permissions:
      contents: write
      pull-requests: write
      issues: write
    # Hash-pinned to v2.1.2 (zizmor requires a commit SHA). factory_ref names the same release.
    # Upgrading means changing the SHA and factory_ref together.
    uses: DustyStudy/issue-factory/.github/workflows/factory.yml@098ab10189f3fa59aa96e81078176d2febc31a95 # probe
    with:
      gate_path: scripts/factory/gate.sh
      factory_ref: 098ab10189f3fa59aa96e81078176d2febc31a95
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      # Falls back to the built-in token until FACTORY_PAT exists. With it, factory PRs trigger CI.
      factory_pat: ${{ secrets.FACTORY_PAT }}

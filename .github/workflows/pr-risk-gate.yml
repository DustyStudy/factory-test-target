# Copy to .github/workflows/pr-risk-gate.yml on the default branch of the target repo.
# A `workflow_run` workflow always runs the default branch's copy of this file, so a PR
# cannot change the code that uses the App key and the Anthropic key.
# Setup (see README): an environment `pr-risk-gate`, restricted to the default branch, holding the
# secrets PR_RISK_APP_KEY and ANTHROPIC_API_KEY; the repository variable PR_RISK_APP_ID; and a
# ruleset that requires the `pr-risk-gate` check with its source pinned to the App.
# Do NOT store the keys as repository secrets: a workflow on any branch can read those.
name: PR risk gate

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] - reads only the pinned gate; no PR code runs here
    # The name of the trigger workflow (examples/pr-trigger.yml).
    workflows: ["pr-trigger"]
    types: [completed]

permissions: {}

jobs:
  risk-gate:
    # Only what the reusable job's GITHUB_TOKEN needs (cloning). The check is posted by the App token.
    permissions:
      contents: read
    # REPLACE the all-zero placeholder with the full 40-character commit SHA of the release you
    # reviewed, and set the version comment to match. The gate runs its scripts and policy from this SHA.
    uses: DustyStudy/pr-risk-gate/.github/workflows/pr-gate.yml@121ffc9624278b3f850a7b0714cf7d1e27f1edd8 # v1.0.0
    with:
      app_id: ${{ vars.PR_RISK_APP_ID }}
    # Passing the name satisfies the gate's required secret; the value comes from the pr-risk-gate environment.
    secrets:
      PR_RISK_APP_KEY: ${{ secrets.PR_RISK_APP_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    # Never `secrets: inherit`. The values come from the pr-risk-gate environment, which the gate job enters.
    # Without ANTHROPIC_API_KEY every PR rates high.

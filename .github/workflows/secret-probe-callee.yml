name: secret-probe-callee
on:
  workflow_call:
    secrets:
      PR_RISK_APP_KEY:
        required: false
permissions: {}
jobs:
  probe:
    environment: pr-risk-gate
    runs-on: ubuntu-latest
    steps:
      - name: env secret read in the reusable job
        env:
          K: ${{ secrets.PR_RISK_APP_KEY }}
        run: echo "callee len=${#K}"

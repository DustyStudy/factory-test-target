name: secret-probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  direct:
    environment: pr-risk-gate
    runs-on: ubuntu-latest
    steps:
      - name: env secret read in the same job
        env:
          K: ${{ secrets.PR_RISK_APP_KEY }}
        run: echo "direct len=${#K}"
  via-caller-no-env:
    uses: ./.github/workflows/secret-probe-callee.yml
    secrets:
      PR_RISK_APP_KEY: ${{ secrets.PR_RISK_APP_KEY }}
  via-caller-inherit:
    uses: ./.github/workflows/secret-probe-callee.yml
    secrets: inherit
